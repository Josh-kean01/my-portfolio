  <script>
    (function () {
      const saved = localStorage.getItem("theme"); // "light" | "dark" | null
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      // Device theme FIRST on first visit, otherwise use saved choice
      const theme =
        saved === "light" || saved === "dark"
          ? saved
          : (prefersDark ? "dark" : "light");

      document.documentElement.classList.toggle("dark", theme === "dark");

      // Optional: keep browser UI bar color in sync (if you use a single theme-color tag)
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#090b0f" : "#eeeeee");
    })();
  </script>
