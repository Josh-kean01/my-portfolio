<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joshua Adekunle - Portfolio</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F4F4F4" />


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">

  <script>
    (function () {
      const saved = localStorage.getItem("theme"); // "light" | "dark" | null
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      // Device theme FIRST on first visit, otherwise use saved choice
      const theme =
        saved === "light" || saved === "dark"
          ? saved
          : (prefersDark ? "dark" : "light");

      document.documentElement.classList.toggle("dark", theme === "dark");

      // Optional: keep browser UI bar color in sync (if you use a single theme-color tag)
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0c0a09" : "#f4f4f4");
    })();
  </script>



  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          colors: {
            primary: "#18181b", // Zinc 900
            "primary-inverse": "#ffffff",
            "background-light": "#f4f4f4", // Light gray/off-white
            "background-dark": "#0c0a09", // Stone 950 / Deep Black
            "surface-light": "#ffffff",
            "surface-dark": "#1c1917", // Stone 900
            "accent": "#007FFF", // Electric Blue accent from some designs
            "border-light": "#e5e5e5",
            "border-dark": "#27272a",
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'fade-in': 'fadeIn 0.5s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        },
      },
    }
  </script>
  <style>
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
</head>

<body
  class="bg-background-light dark:bg-background-dark text-primary dark:text-gray-100 antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
  <div id="root"></div>

  <script type="module" src="/index.tsx"></script>
</body>

</html>
