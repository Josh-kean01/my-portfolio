<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joshua Adekunle - Portfolio</title>
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eeeeee" />

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-ja-ultra-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-ja-ultra-16.png" />

  <link rel="icon" type="image/svg+xml" href="ja_logo_embedded_spacegrotesk.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-ja-180.png" />


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">

  <script>
    (function () {
      const saved = localStorage.getItem("theme"); // "light" | "dark" | null
      const prefersDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      // Device theme FIRST on first visit, otherwise use saved choice
      const theme =
        saved === "light" || saved === "dark"
          ? saved
          : (prefersDark ? "dark" : "light");

      document.documentElement.classList.toggle("dark", theme === "dark");

      // Optional: keep browser UI bar color in sync (if you use a single theme-color tag)
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0c0a09" : "#eeeeee");
    })();
  </script>



  <style>
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>

<body
  class="bg-background-light dark:bg-background-dark text-primary dark:text-gray-100 antialiased selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
  <div id="root"></div>

  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
