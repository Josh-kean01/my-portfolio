<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="John Abodunrin — Video Editor Portfolio">
  <title>John Abodunrin — Video Editor Portfolio</title>

  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.3" fill="#f5f0e8" opacity="0.055"/>
    </pattern>
    <style>
      .display { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: 1.5px; }
      .stamp   { font-family: "Courier New", Courier, monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1600" height="1200" fill="#0a0a0a"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>

  <!-- top meta -->
  <text x="180" y="212" class="stamp" font-size="22" fill="#f5f0e8" opacity="0.40" letter-spacing="6">PORTFOLIO</text>
  <text x="1420" y="212" class="stamp" font-size="22" fill="#f5f0e8" opacity="0.40" letter-spacing="6" text-anchor="end">2026</text>
  <rect x="180" y="240" width="1240" height="1" fill="#f5f0e8" opacity="0.10"/>

  <!-- wordmark -->
  <rect x="180" y="356" width="132" height="60" fill="#ff0000"/>
  <text x="203" y="398" class="stamp" font-size="33" fill="#ffffff">John</text>
  <text x="330" y="398" class="stamp" font-size="33" fill="#f5f0e8">Abodunrin</text>

  <!-- headline -->
  <text x="180" y="606" class="display" font-size="184" fill="#f5f0e8">VIDEO EDITOR</text>
  <text x="180" y="774" class="display" font-size="184" fill="#ff0000">PORTFOLIO</text>

  <!-- tagline -->
  <text x="184" y="864" class="stamp" font-size="27" fill="#f5f0e8" opacity="0.55">Editing videos people actually watch.</text>

  <!-- bottom meta -->
  <rect x="180" y="960" width="1240" height="1" fill="#f5f0e8" opacity="0.10"/>
  <text x="180" y="1024" class="stamp" font-size="22" fill="#f5f0e8" opacity="0.45" letter-spacing="3">Video Editing · Thumbnail Design · Scriptwriting</text>
  <text x="1420" y="1024" class="stamp" font-size="22" fill="#ff0000" letter-spacing="3" text-anchor="end">50M+ VIEWS</text>
</svg>
